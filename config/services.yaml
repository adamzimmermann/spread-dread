parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\OddsApiService:
        arguments:
            $oddsApiKey: '%env(ODDS_API_KEY)%'

    Symfony\Component\Mailer\MailerInterface:
        alias: mailer.mailer
        public: true

    App\Service\InviteService:
        public: true
        arguments:
            $mailFrom: '%app.mail_from%'
            $mailFromName: '%app.mail_from_name%'
